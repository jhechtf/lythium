name: Run Database Migrations

# Promotes migrations e2e -> production for the exact commit CI just validated on main.
# `workflow_run` is used (rather than `push`) so no database is touched until required CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One promotion at a time; queue (never cancel) so an in-flight migration is not interrupted.
concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect migration changes
    # Only trusted, successful push runs of CI on main in this repository.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check for migration changes in the commit
        id: diff
        run: |
          if git diff --quiet HEAD^ HEAD -- packages/db/drizzle; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  migrate-e2e:
    name: Migrate e2e
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: pnpm migrate
        env:
          DB_URL: ${{ secrets.DB_URL }}

  migrate-production:
    name: Migrate production
    needs: migrate-e2e
    runs-on: ubuntu-latest
    # Approval is enforced by the environment's protection rules.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: pnpm migrate
        env:
          DB_URL: ${{ secrets.DB_URL }}
