name: Run Database Migrations

# Promotes migrations e2e -> production for the exact commit CI just validated on main.
# Migrations are idempotent, so every successful main CI run promotes (a no-op when nothing is pending).
# `workflow_run` is used (rather than `push`) so no database is touched until required CI passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One promotion at a time; queue (never cancel) so an in-flight migration is not interrupted.
concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-e2e:
    name: Migrate e2e
    # Only trusted, successful push runs of CI on main in this repository.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: pnpm migrate
        env:
          DB_URL: ${{ secrets.DB_URL }}

  migrate-production:
    name: Migrate production
    needs: migrate-e2e
    runs-on: ubuntu-latest
    # Approval is enforced by the environment's protection rules.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: packages/db
        run: pnpm migrate
        env:
          DB_URL: ${{ secrets.DB_URL }}
