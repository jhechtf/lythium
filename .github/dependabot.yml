version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # One PR per week for everything that isn't a major bump.
      minor-and-patch:
        update-types: [minor, patch]
      # Majors get their own PR per package: they need a human look.
    ignore:
      # apps/web must stay on TS 6 (svelte-kit needs the JS compiler API, which TS 7 lacks).
      # Node packages already use 7 via the catalog. Revisit when svelte-kit supports TS 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
